<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#001e3d" />
      <stop offset="100%" stop-color="#002b49" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004e7c" />
      <stop offset="50%" stop-color="#008080" />
      <stop offset="100%" stop-color="#00a896" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d06f" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#00b4d8" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Credit Card Graphic -->
  <g transform="translate(180, 75)" filter="url(#shadow)">
    <!-- Card Body -->
    <rect width="440" height="260" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

    <!-- Chip -->
    <rect x="40" y="45" width="55" height="42" rx="8" fill="url(#chipGrad)" stroke="#d4a373" stroke-width="1" />
    <path d="M40 66 H95 M67 45 V87" stroke="#b08968" stroke-width="1" fill="none" />

    <!-- Contactless wave -->
    <path d="M115 54 A14 14 0 0 1 115 78 M123 48 A22 22 0 0 1 123 84" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Validated Badge -->
    <g transform="translate(305, 45)">
      <rect width="95" height="30" rx="15" fill="#02c39a" />
      <circle cx="16" cy="15" r="7" fill="#ffffff" />
      <path d="M12.5 15 L15 17.5 L19.5 13" stroke="#02c39a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="30" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#053830">VALID</text>
    </g>

    <!-- Card Numbers -->
    <text x="40" y="150" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="4">
      4539  1488  0343  6467
    </text>

    <!-- Card Labels -->
    <text x="40" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" letter-spacing="1">ALGORITHM</text>
    <text x="40" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">LUHN CHECKSUM</text>

    <text x="260" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" letter-spacing="1">LANGUAGE</text>
    <text x="260" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PYTHON 3.x</text>
  </g>

  <!-- Title Bottom Bar -->
  <text x="400" y="390" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="1">
    Validador de Cartão de Crédito
  </text>
  <text x="400" y="415" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#00b4d8" letter-spacing="0.5">
    Algoritmo de Luhn • Testes Unitários Automatizados
  </text>
</svg>
